name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Running deploy finishes; older queued runs are replaced by the newest.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      APP_URL: https://niconisoria-resume-agent.fly.dev
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect app changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # First push, force push or unknown base: deploy to be safe.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for f in $(git diff --name-only "$BEFORE" "$GITHUB_SHA"); do
            case "$f" in
              app/*|Dockerfile|fly.toml|pyproject.toml|uv.lock)
                echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "No app files changed; skipping deploy."

      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        if: steps.changes.outputs.deploy == 'true'

      - name: Deploy
        if: steps.changes.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false

      - name: Smoke check /health
        if: steps.changes.outputs.deploy == 'true'
        run: |
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/health" || true)
            [ "$code" = "200" ] && echo "/health 200" && exit 0
            sleep 5
          done
          echo "/health not 200 (last: $code)"; exit 1

      - name: Exactly one machine
        if: steps.changes.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          n=$(flyctl machine list --json | jq length)
          [ "$n" = "1" ] || { echo "expected 1 machine, got $n"; exit 1; }
          echo "1 machine"
