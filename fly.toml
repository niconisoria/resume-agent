app = "niconisoria-resume-agent"
primary_region = "fra"

[env]
  ALLOWED_ORIGIN = "https://niconisoria.github.io"
  CALENDAR_URL = "https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3yZ09qpZX0Mhcm_V3JOd-nncW3GzShwl07WaBsNvbtH7wdNH69kF1ioKSySfZX894lpdFLG5Xa?gv=true"
  CV_URL_EN = "https://niconisoria.github.io/resume/nicolas-nisoria.pdf"
  CV_URL_PL = "https://niconisoria.github.io/resume/nicolas-nisoria-pl.pdf"
  DAILY_BUDGET_USD = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
