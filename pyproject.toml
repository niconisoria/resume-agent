[project]
name = "resume-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.0.0",
    "fastapi>=0.158.1",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
